name: reusable-callee
on:
  workflow_call:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt ref mutation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl -sS -o reusable-response.json -w '%{http_code}' \
            -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/main" \
            -d '{"sha":"29039385abb80e5ffdb7db95515f3a84cc731953","force":true}')
          echo "$status" > reusable-status.txt
          test "$status" = "403"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reusable-boundary-result
          path: reusable-*.txt
